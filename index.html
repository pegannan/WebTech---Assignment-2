<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Workshop Registration</title>
    <link rel="stylesheet" href="styles.css">
    <!-- import google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="form-container">
        <h1>Developer Workshop Registration</h1>
        
        <!-- Form container to holdd all form elements -->
        <form id="registration-form">
            <div class="form-group">
                <label for="name">Full Name: </label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email:  </label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="experience-level">Experience Level: </label> 
                <select id="experience-level" name="experience-level" >
                    <option value="Beginner">Beginner</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Advanced">Advanced</option>
                </select>  
            </div>

            <div class="form-group">
                <span class="workshop-track-label">Workshop Track: </span>
                <div class="workshop-track">
                    <div class="track-option">
                        <input type="radio" id="frontend-web" name="workshop-track" value="Frontend Web">
                        <label for="frontend-web">Frontend Web</label>
                    </div>
                    <div class="track-option">
                        <input type="radio" id="backend-apis" name="workshop-track" value="Backend APIs">
                        <label for="backend-apis">Backend APIs</label>
                    </div>
                    <div class="track-option">
                        <input type="radio" id="ui-ux" name="workshop-track" value="UI/UX Design">
                        <label for="ui-ux">UI/UX Design</label>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <input type="checkbox" id="notifications" name="notifications">
                <label for="notifications">I agree to receive notifications about event updates for the workshop.</label>
            </div>
            
            <button class="submit-btn" type="submit">Register Now</button>
        </form>
    </div>
</body>
</html>
